services:
  postgres:
    image: postgres:18-alpine
    container_name: insiderguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc
      POSTGRES_DB: insiderguard

    ports:
      - "5433:5432"

    volumes:
      - insiderguard_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d insiderguard"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  redis:
    image: redis:7-alpine
    container_name: insiderguard-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - insiderguard_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: insiderguard-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: insiderguard-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - insiderguard_frontend_node_modules:/app/node_modules


volumes:
  insiderguard_postgres_data:
  insiderguard_redis_data:
  insiderguard_frontend_node_modules: